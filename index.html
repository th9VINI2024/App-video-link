<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui, Arial;
  background:#f9f9f9;
}

/* animações premium */
.fade{animation:fade .4s ease}
.slide{animation:slide .4s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

/* ===== TELA FAKE ===== */
#fake{
  min-height:100vh;
  padding:20px;
}
.fake-title{
  text-align:center;
  color:#ff0000;
  font-size:32px;
  font-weight:700;
  margin:40px 0 20px;
}
.fake-search{
  display:flex;
  margin-bottom:20px;
}
.fake-search input{
  flex:1;
  padding:14px;
  border-radius:30px;
  border:1px solid #ccc;
  font-size:16px;
}

/* cards fake */
.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  margin-bottom:16px;
  box-shadow:0 4px 10px rgba(0,0,0,.12);
}
.card iframe{
  width:100%;
  height:200px;
}
.card p{
  padding:10px;
  margin:0;
  font-weight:500;
}

/* ===== APP SECRETO ===== */
#app{
  display:none;
  padding:16px;
}
.app-title{
  text-align:center;
  color:#ff0000;
  font-size:30px;
  margin-bottom:12px;
}

/* busca interna */
.search-box{
  display:flex;
  margin-bottom:14px;
}
.search-box input{
  flex:1;
  padding:12px;
  border-radius:25px 0 0 25px;
  border:1px solid #ccc;
}
.search-box button{
  background:#ff0000;
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:0 25px 25px 0;
}

/* abas */
.tabs{
  display:flex;
  gap:10px;
  margin-bottom:14px;
}
.tab{
  flex:1;
  padding:10px;
  border-radius:20px;
  border:none;
  background:#eee;
  font-weight:600;
}
.tab.active{
  background:#ff0000;
  color:white;
}
video{
  width:100%;
  border-radius:12px;
}
</style>
</head>

<body>

<!-- ===== TELA FAKE ===== -->
<div id="fake" class="fade">
  <div class="fake-title">YouTube</div>

  <div class="fake-search">
    <input id="busca" placeholder="Pesquisar no YouTube">
  </div>

  <!-- vídeos recomendados fake -->
  <div class="card slide">
    <iframe src="https://www.youtube.com/embed/7D4Tfab_X4k" allowfullscreen></iframe>
    <p>Palmeiras busca virada épica</p>
  </div>

  <div class="card slide">
    <iframe src="https://www.youtube.com/embed/uiyQDQxvCqU" allowfullscreen></iframe>
    <p>Palmeiras 4x3 Flamengo</p>
  </div>
</div>

<!-- ===== APP SECRETO ===== -->
<div id="app" class="fade">

  <div class="app-title">YouTube</div>

  <div class="search-box">
    <input id="searchApp" placeholder="Pesquisar no YouTube">
    <button onclick="buscar()">🔍</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="mostrar('inicio', this)">Início</button>
    <button class="tab" onclick="mostrar('meus', this)">Meus Vídeos</button>
  </div>

  <!-- INÍCIO -->
  <div id="inicio" class="slide">
    <div class="card">
      <iframe src="https://www.youtube.com/embed/Z8YtuRj5p20" allowfullscreen></iframe>
      <p>Botafogo 3x4 Palmeiras</p>
    </div>
  </div>

  <!-- MEUS VÍDEOS -->
  <div id="meus" style="display:none" class="slide">
    <div class="card">
      <video controls>
        <source src="video.mp4" type="video/mp4">
      </video>
      <p>Vídeo secreto</p>
    </div>
  </div>

</div>

<script>
const PALAVRA_SECRETA = "bolsonaro";

busca.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    if(e.target.value.toLowerCase() === PALAVRA_SECRETA){
      fake.style.display="none";
      app.style.display="block";
    }else{
      window.location.href =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(e.target.value);
    }
  }
});

function mostrar(id, btn){
  inicio.style.display="none";
  meus.style.display="none";
  document.getElementById(id).style.display="block";

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");
}

function buscar(){
  window.location.href =
    "https://www.youtube.com/results?search_query=" +
    encodeURIComponent(searchApp.value);
}
</script>

</body>
</html>
