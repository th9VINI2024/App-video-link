<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>YouTube</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      font-family: system-ui, Arial, sans-serif;
      background: #f9f9f9;
      color: #000;
    }

    /* TELA FAKE */
    .fake {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .logo {
      color: #ff0000;
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .search-box {
      width: 85%;
      max-width: 380px;
      display: flex;
    }

    .search-box input {
      flex: 1;
      padding: 12px;
      border-radius: 20px 0 0 20px;
      border: 1px solid #ccc;
      font-size: 16px;
      outline: none;
      background: #fff;
      color: #000;
    }

    .search-box button {
      padding: 12px 16px;
      border-radius: 0 20px 20px 0;
      border: none;
      background: #ff0000;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    .msg {
      margin-top: 10px;
      color: #666;
      font-size: 14px;
    }

    /* APP REAL */
    .app {
      display: none;
      max-width: 420px;
      margin: auto;
      padding: 16px;
    }

    .app input, .app button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    .app input {
      margin-bottom: 8px;
      background: #fff;
      color: #000;
    }

    .app button {
      background: #ff0000;
      color: #fff;
      border: none;
      margin-bottom: 12px;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #fff;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
    }

    a {
      color: #000;
      text-decoration: none;
      display: block;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- TELA DISFARÇADA -->
  <div class="fake" id="fake">
    <div class="logo">YouTube</div>

    <div class="search-box">
      <input id="busca" placeholder="Pesquisar no YouTube">
      <button onclick="pesquisar()">🔍</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <!-- APP REAL -->
  <div class="app" id="app">
    <input id="nome" placeholder="Nome do vídeo">
    <input id="link" placeholder="Cole o link aqui">
    <button onclick="salvar()">Adicionar</button>
    <ul id="lista"></ul>
  </div>

  <script>
    const PALAVRA_SECRETA = "bolsonaro";

    function pesquisar() {
      const texto = document.getElementById("busca").value.trim().toLowerCase();

      if (texto === PALAVRA_SECRETA) {
        document.getElementById("fake").style.display = "none";
        document.getElementById("app").style.display = "block";
      } else {
        //  YOUTUBE 
        window.location.href =
          "https://www.youtube.com/results?search_query=" +
          encodeURIComponent(texto);
      }
    }

    // 📦 COFRE DE LINKS
    const lista = document.getElementById("lista");
    const inputLink = document.getElementById("link");
    const inputNome = document.getElementById("nome");

    let links = JSON.parse(localStorage.getItem("cofreLinks")) || [];

    function salvar() {
      const url = inputLink.value.trim();
      const nome = inputNome.value.trim();
      if (!url || !nome) return;

      links.push({ nome, url });
      localStorage.setItem("cofreLinks", JSON.stringify(links));

      inputLink.value = "";
      inputNome.value = "";
      render();
    }

    function render() {
      lista.innerHTML = "";
      links.forEach(item => {
        const li = document.createElement("li");
        li.innerHTML = `<a href="${item.url}" target="_self">▶ ${item.nome}</a>`;
        lista.appendChild(li);
      });
    }

    render();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>

</body>
</html>
