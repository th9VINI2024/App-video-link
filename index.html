<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>YouTube</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff0000">

  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      font-family: system-ui, Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    .app {
      max-width: 420px;
      margin: auto;
      padding: 16px;
      display: none;
    }

    h1 {
      text-align: center;
      color: #ff0000;
      margin-bottom: 12px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
    }

    input {
      margin-bottom: 8px;
      background: #111;
      color: #fff;
    }

    button {
      background: #ff0000;
      color: #fff;
      cursor: pointer;
      margin-bottom: 12px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #111;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    a {
      color: #fff;
      text-decoration: none;
      display: block;
    }

    /* TELA PIN */
    .pin {
      max-width: 300px;
      margin: 120px auto;
      text-align: center;
    }

    .pin h2 {
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <!-- TELA PIN -->
  <div class="pin" id="pinTela">
    <h2>YouTube</h2>
    <input id="pinInput" type="password" placeholder="Digite o PIN">
    <button onclick="verificarPIN()">Entrar</button>
  </div>

  <!-- APP -->
  <div class="app" id="app">
    <h1>YouTube</h1>

    <input id="nome" placeholder="Nome do vídeo">
    <input id="link" placeholder="Cole o link aqui">
    <button onclick="salvar()">Adicionar</button>

    <ul id="lista"></ul>
  </div>

  <script>
    // 🔐 PIN
    const PIN_CORRETO = "1914";

    const pinTela = document.getElementById("pinTela");
    const app = document.getElementById("app");
    const pinInput = document.getElementById("pinInput");

    function verificarPIN() {
      if (pinInput.value === PIN_CORRETO) {
        pinTela.style.display = "none";
        app.style.display = "block";
      } else {
        alert("PIN incorreto");
        pinInput.value = "";
      }
    }

    // 📦 LINKS
    const lista = document.getElementById("lista");
    const inputLink = document.getElementById("link");
    const inputNome = document.getElementById("nome");

    let links = JSON.parse(localStorage.getItem("cofreLinks")) || [];

    function salvar() {
      const url = inputLink.value.trim();
      const nome = inputNome.value.trim();

      if (!url || !nome) return;

      links.push({ nome, url });
      localStorage.setItem("cofreLinks", JSON.stringify(links));

      inputLink.value = "";
      inputNome.value = "";
      render();
    }

    function render() {
      lista.innerHTML = "";
      links.forEach(item => {
        const li = document.createElement("li");
        li.innerHTML = `<a href="${item.url}" target="_self">▶ ${item.nome}</a>`;
        lista.appendChild(li);
      });
    }

    render();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>

</body>
</html>
