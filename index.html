<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>YouTube</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff0000">
<link rel="manifest" href="manifest.json">

<style>
body {
  margin: 0;
  font-family: system-ui, Arial, sans-serif;
  background: #f9f9f9;
}

/* TELA FAKE */
.fake {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 80px;
  min-height: 100vh;
}

.logo {
  color: #ff0000;
  font-size: 36px;
  font-weight: bold;
  margin-bottom: 20px;
}

.search-box {
  width: 85%;
  max-width: 380px;
  display: flex;
  margin-bottom: 20px;
  position: relative;
  z-index: 9999;
}

.search-box input {
  flex: 1;
  padding: 12px;
  border-radius: 20px 0 0 20px;
  border: 1px solid #ccc;
  font-size: 16px;
}

.search-box button {
  padding: 12px 16px;
  border-radius: 0 20px 20px 0;
  border: none;
  background: #ff0000;
  color: #fff;
}

.recomendados {
  width: 90%;
  max-width: 380px;
}

.recomendados iframe {
  width: 100%;
  height: 200px;
  border-radius: 12px;
  margin-bottom: 12px;
  border: none;
  pointer-events: none;
}

/* APP REAL */
.app {
  display: none;
  max-width: 420px;
  margin: auto;
  padding: 16px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.tabs button {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #eee;
  font-weight: bold;
}

.tabs button.active {
  background: #ff0000;
  color: #fff;
}

.section { display: none; }
.section.active { display: block; }

input, button {
  width: 100%;
  padding: 12px;
  margin-bottom: 8px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button.main {
  background: #ff0000;
  color: #fff;
  border: none;
}

ul { list-style: none; padding: 0; }

li {
  background: #fff;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 1px solid #ddd;

  .search-box input {
  width: auto !important;
  flex: 1 !important;
  margin-bottom: 0 !important;
}

.search-box button {
  width: auto !important;
  margin-bottom: 0 !important;
}
</style>
</head>

<body>

<!-- TELA FAKE -->
<div class="fake" id="fake">
  <div class="logo">YouTube</div>

  <form class="search-box" onsubmit="pesquisar(event)">
    <input id="busca" type="search" placeholder="Pesquisar no YouTube" autocomplete="off">
    <button type="submit">🔍</button>
  </form>

  <div class="recomendados">
    <iframe src="https://www.youtube.com/embed/7D4Tfab_X4k"></iframe>
    <iframe src="https://www.youtube.com/embed/uiyQDQxvCqU"></iframe>
    <iframe src="https://www.youtube.com/embed/Z8YtuRj5p20"></iframe>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">

<div class="tabs">
  <button id="tabCofre" class="active" onclick="abrirAba('cofre')">📁 Cofre</button>
  <button id="tabDownload" onclick="abrirAba('download')">📥 Baixar</button>
  <button id="tabVideos" onclick="abrirAba('videos')">🎞️ Meus Vídeos</button>
</div>

<div id="cofre" class="section active">
  <input id="nome" placeholder="Nome do vídeo">
  <input id="link" placeholder="Cole o link">
  <button class="main" onclick="salvar()">Adicionar</button>
  <ul id="lista"></ul>
</div>

<div id="download" class="section">
  <input id="downloadLink" placeholder="Link direto do vídeo (.mp4)">
  <button class="main" onclick="baixarVideo()">Baixar vídeo</button>
  <p id="downloadMsg"></p>
</div>

<div id="videos" class="section">
  <ul id="listaVideos"></ul>
</div>

</div>

<script>
const PALAVRA_SECRETA = "veiga";

function pesquisar(e) {
  e.preventDefault();
  const texto = busca.value.trim().toLowerCase();
  if (!texto) return;

  if (texto === PALAVRA_SECRETA) {
    fake.style.display = "none";
    app.style.display = "block";
    busca.value = "";
  } else {
    window.location.href =
      "https://www.youtube.com/results?search_query=" +
      encodeURIComponent(texto);
  }
}

function abrirAba(nome) {
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
  document.getElementById(nome).classList.add("active");
  document.getElementById("tab" + nome.charAt(0).toUpperCase() + nome.slice(1)).classList.add("active");
}

/* COFRE */
let links = JSON.parse(localStorage.getItem("cofreLinks")) || [];
function salvar() {
  if (!nome.value || !link.value) return;
  links.push({ nome: nome.value, url: link.value });
  localStorage.setItem("cofreLinks", JSON.stringify(links));
  nome.value = "";
  link.value = "";
  render();
}
function render() {
  lista.innerHTML = "";
  links.forEach(i => lista.innerHTML += `<li><a href="${i.url}">▶ ${i.nome}</a></li>`);
}
render();

/* MEUS VÍDEOS */
let videos = JSON.parse(localStorage.getItem("meusVideos")) || [];

function baixarVideo() {
  if (!downloadLink.value) return;

  videos.push({
    url: downloadLink.value,
    nome: "Vídeo " + (videos.length + 1)
  });

  localStorage.setItem("meusVideos", JSON.stringify(videos));
  atualizarVideos();

  const a = document.createElement("a");
  a.href = downloadLink.value;
  a.target = "_blank";
  a.click();

  downloadMsg.innerText = "Download iniciado 📥";
  downloadLink.value = "";
}

function atualizarVideos() {
  listaVideos.innerHTML = "";
  videos.forEach(v => {
    listaVideos.innerHTML += `<li><a href="${v.url}" target="_blank">▶ ${v.nome}</a></li>`;
  });
}
atualizarVideos();
</script>

</body>
</html>
