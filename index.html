<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>YouTube</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: #fff;
      color: #111;
    }

    header {
      padding: 18px;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #ff0000;
    }

    .search-box {
      display: flex;
      max-width: 420px;
      margin: 0 auto 20px;
      padding: 0 16px;
    }

    .search-box input {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      border-radius: 30px 0 0 30px;
      border: 1px solid #ddd;
      outline: none;
    }

    .search-box button {
      padding: 0 18px;
      border-radius: 0 30px 30px 0;
      border: none;
      background: #ff0000;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    nav button {
      padding: 10px 18px;
      border-radius: 20px;
      border: none;
      background: #f2f2f2;
      cursor: pointer;
      font-weight: 500;
    }

    nav button.active {
      background: #ff0000;
      color: #fff;
    }

    .container {
      max-width: 720px;
      margin: auto;
      padding: 0 16px 40px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      overflow: hidden;
    }

    .card iframe, .card video {
      width: 100%;
      height: 220px;
      border: none;
    }

    .card-title {
      padding: 12px;
      font-weight: 600;
    }

    .add-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    .add-box button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #ff0000;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<header>YouTube</header>

<div class="search-box">
  <input id="busca" placeholder="Pesquisar no YouTube">
  <button onclick="pesquisar()">🔍</button>
</div>

<nav>
  <button id="btn-home" class="active" onclick="mostrar('home')">Início</button>
  <button id="btn-videos" onclick="mostrar('videos')">Meus Vídeos</button>
</nav>

<div class="container">

  <!-- HOME -->
  <div id="home">
    <div class="card">
      <iframe src="https://www.youtube.com/embed/7D4Tfab_X4k" allowfullscreen></iframe>
      <div class="card-title">Palmeiras busca virada</div>
    </div>

    <div class="card">
      <iframe src="https://www.youtube.com/embed/uiyQDQxvCqU" allowfullscreen></iframe>
      <div class="card-title">Palmeiras 4x3 Flamengo</div>
    </div>

    <div class="card">
      <iframe src="https://www.youtube.com/embed/Z8YtuRj5p20" allowfullscreen></iframe>
      <div class="card-title">Botafogo 3x4 Palmeiras</div>
    </div>
  </div>

  <!-- MEUS VÍDEOS -->
  <div id="videos" class="hidden">

    <div class="add-box">
      <input id="nomeVideo" placeholder="Nome do vídeo">
      <input id="linkVideo" placeholder="Link do vídeo (embed ou .mp4)">
      <button onclick="salvarVideo()">Salvar vídeo</button>
    </div>

    <div id="listaVideos"></div>
  </div>

</div>

<script>
  const PALAVRA_SECRETA = "veiga";
  let videos = JSON.parse(localStorage.getItem("meusVideos")) || [];

  function pesquisar() {
    const texto = document.getElementById("busca").value.trim().toLowerCase();
    if (texto === PALAVRA_SECRETA) {
      mostrar("videos");
    } else {
      window.location.href =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(texto);
    }
  }

  function mostrar(aba) {
    document.getElementById("home").classList.add("hidden");
    document.getElementById("videos").classList.add("hidden");
    document.getElementById("btn-home").classList.remove("active");
    document.getElementById("btn-videos").classList.remove("active");

    document.getElementById(aba).classList.remove("hidden");
    document.getElementById("btn-" + aba).classList.add("active");
  }

  function salvarVideo() {
    const nome = nomeVideo.value.trim();
    const link = linkVideo.value.trim();
    if (!nome || !link) return;

    videos.push({ nome, link });
    localStorage.setItem("meusVideos", JSON.stringify(videos));
    nomeVideo.value = "";
    linkVideo.value = "";
    renderVideos();
  }

  function renderVideos() {
    listaVideos.innerHTML = "";
    videos.forEach(v => {
      const card = document.createElement("div");
      card.className = "card";

      if (v.link.includes(".mp4")) {
        card.innerHTML = `
          <video controls src="${v.link}"></video>
          <div class="card-title">${v.nome}</div>
        `;
      } else {
        card.innerHTML = `
          <iframe src="${v.link}" allowfullscreen></iframe>
          <div class="card-title">${v.nome}</div>
        `;
      }

      listaVideos.appendChild(card);
    });
  }

  renderVideos();
</script>

</body>
</html>
