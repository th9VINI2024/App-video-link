<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube</title>

<style>
body{
  margin:0;
  font-family: system-ui, Arial;
  background:#f9f9f9;
}

/* ===== TELA FAKE ===== */
#fake{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

#fake input{
  padding:14px;
  width:70%;
  border-radius:30px;
  border:1px solid #ccc;
  font-size:16px;
}

/* ===== APP SECRETO ===== */
#app{
  display:none;
  padding:16px;
}

h1{
  text-align:center;
  color:#ff0000;
}

/* busca */
.search-box{
  display:flex;
  margin-bottom:14px;
}
.search-box input{
  flex:1;
  padding:12px;
  border-radius:25px 0 0 25px;
  border:1px solid #ccc;
}
.search-box button{
  background:#ff0000;
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:0 25px 25px 0;
}

/* abas */
.tabs{
  display:flex;
  gap:10px;
  margin-bottom:14px;
}
.tab{
  flex:1;
  padding:10px;
  border-radius:20px;
  border:none;
  background:#eee;
}
.tab.active{
  background:#ff0000;
  color:white;
}

/* cards */
.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  margin-bottom:16px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}
.card iframe, .card video{
  width:100%;
  height:200px;
}
.card p{
  padding:10px;
  margin:0;
  font-weight:500;
}
</style>
</head>

<body>

<!-- ===== TELA FAKE ===== -->
<div id="fake">
  <input id="busca" placeholder="Pesquisar no YouTube">
</div>

<!-- ===== APP SECRETO ===== -->
<div id="app">

<h1>YouTube</h1>

<div class="search-box">
  <input id="searchApp" placeholder="Pesquisar no YouTube">
  <button onclick="buscar()">🔍</button>
</div>

<div class="tabs">
  <button class="tab active" onclick="mostrar('inicio')">Início</button>
  <button class="tab" onclick="mostrar('meus')">Meus Vídeos</button>
</div>

<!-- INÍCIO -->
<div id="inicio">
  <div class="card">
    <iframe src="https://www.youtube.com/embed/7D4Tfab_X4k"
      allowfullscreen></iframe>
    <p>Palmeiras busca virada</p>
  </div>

  <div class="card">
    <iframe src="https://www.youtube.com/embed/uiyQDQxvCqU"
      allowfullscreen></iframe>
    <p>Palmeiras 4x3 Flamengo</p>
  </div>
</div>

<!-- MEUS VÍDEOS -->
<div id="meus" style="display:none">
  <div class="card">
    <video controls>
      <source src="video.mp4" type="video/mp4">
    </video>
    <p>Meu vídeo secreto</p>
  </div>
</div>

</div>

<script>
const PALAVRA_SECRETA = "bolsonaro";

document.getElementById("busca").addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    if(e.target.value.toLowerCase() === PALAVRA_SECRETA){
      fake.style.display="none";
      app.style.display="block";
    }else{
      window.location.href =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(e.target.value);
    }
  }
});

function mostrar(id){
  document.getElementById("inicio").style.display="none";
  document.getElementById("meus").style.display="none";
  document.getElementById(id).style.display="block";

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  event.target.classList.add("active");
}

function buscar(){
  const q = searchApp.value;
  window.location.href =
    "https://www.youtube.com/results?search_query=" +
    encodeURIComponent(q);
}
</script>

</body>
</html>
